version: 2
updates:
  # Inert while the Dockerfile tracks the floating nginx:alpine — there is no
  # newer tag to bump to, the weekly rebuild picks the new mainline up on its
  # own. It is kept because the escape hatch from mainline is to pin a minor
  # here (see the Dockerfile), and from that moment this entry does the work
  # again without anyone having to remember it exists.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Update"
    labels:
      - "dependencies"

  # The workflow's own actions (checkout, buildx, metadata, build-push) age too,
  # and a deprecated major eventually stops running without warning. (Keeping
  # the weekly rebuild from being disabled after 60 days without a commit is
  # the keepalive job's task in docker.yml, not this entry's.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Update"
    labels:
      - "dependencies"
